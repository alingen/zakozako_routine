name: MesugakiRoutine
options:
  bundleIdPrefix: com.zakozako.mesugakiroutine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  MesugakiRoutine:
    type: application
    platform: iOS
    sources:
      - path: MesugakiRoutine
        excludes:
          # 開発端末専用の秘密情報。生成したXcode projectにも絶対に含めない。
          - Resources/Secrets.local.json
    info:
      path: MesugakiRoutine/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: 小悪魔コーチ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakozako.mesugakiroutine
        PRODUCT_NAME: MesugakiRoutine
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YZZRP6M55K
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - MesugakiRoutineTests
      gatherCoverageData: true

  MesugakiRoutineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MesugakiRoutineTests
    dependencies:
      - target: MesugakiRoutine

schemes:
  MesugakiRoutine:
    build:
      targets:
        MesugakiRoutine: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: MesugakiRoutineTests
    archive:
      config: Release

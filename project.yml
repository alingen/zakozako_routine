name: MesugakiRoutine
options:
  bundleIdPrefix: com.zakozako.mesugakiroutine
  # 日本語専用アプリ。戻るボタンなどシステム側の文言も日本語にする。
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  MesugakiRoutine:
    type: application
    platform: iOS
    sources:
      - path: MesugakiRoutine
        excludes:
          # 開発端末専用の秘密情報。生成したXcode projectにも絶対に含めない。
          - Resources/Secrets.local.json
      - path: ScreenTimeShared
    entitlements:
      path: MesugakiRoutine/MesugakiRoutine.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zakozako.mesugakiroutine
    info:
      path: MesugakiRoutine/Resources/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDisplayName: ざこルーティン
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakozako.mesugakiroutine
        PRODUCT_NAME: MesugakiRoutine
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YZZRP6M55K
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: ScreenTimeMonitorExtension
        embed: true
    scheme:
      testTargets:
        - MesugakiRoutineTests
      gatherCoverageData: true

  MesugakiRoutineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MesugakiRoutineTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: MesugakiRoutine

  ScreenTimeMonitorExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenTimeMonitorExtension
      - path: ScreenTimeShared
    info:
      path: ScreenTimeMonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: Screen Time Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ScreenTimeMonitorExtension
    entitlements:
      path: ScreenTimeMonitorExtension/ScreenTimeMonitorExtension.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.com.zakozako.mesugakiroutine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zakozako.mesugakiroutine.ScreenTimeMonitorExtension
        PRODUCT_NAME: ScreenTimeMonitorExtension
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YZZRP6M55K
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  MesugakiRoutine:
    build:
      targets:
        MesugakiRoutine: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: MesugakiRoutineTests
    archive:
      config: Release
